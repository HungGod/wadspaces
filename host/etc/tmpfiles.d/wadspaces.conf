d /var/home/wad 0700 wad wad -
d /var/lib/wadspaces 0700 root root -
d /var/home/admin 0700 admin admin -
# Project folders (wadd's projects), one per project: the kiosk user's (uid
# 1000, abc in the workspace images), since containers write them. Outside
# /var/lib/wadspaces, which is root's alone.
d /var/lib/wadspaces-projects 0750 wad wad -
# Saved sign-ins (wadd's signins), one folder each, mounted into the
# workspaces that use them: the kiosk user's for the same reason, and no one
# else's (they hold sign-in cookies and tokens).
d /var/lib/wadspaces-signins 0700 wad wad -
# Drives that drive projects are on, when wadd mounts them (wadd's drives,
# through systemd-mount, so the mount is in the host's namespace).
d /run/wadspaces-drives 0755 root root -
# The workspaces' quadlet units: wadd writes them here at every start, so
# they're never stale (and gone after a rollback to an image that keeps its
# own in /etc).
d /run/containers/systemd 0755 root root -
# The Cloudflare tunnel's token (/etc/cloudflared/token, cloudflared.service):
# root's alone. wadd replaces it there when it's changed (Secrets → Cloud
# Tunnel), so the folder must be there for wadd.service to write in it.
d /etc/cloudflared 0700 root root -
# tailscaled's state (the machine's key and its tailnet login): root's alone.
# tailscaled.service makes it too (StateDirectory); here so bootc's lint
# knows what's in /var.
d /var/lib/tailscale 0700 root root -
d /var/cache/tailscale 0750 root root -
