# wadd's settings on a WadSpaces machine (the image's; wad_config reads this,
# then /etc/wadspaces/wadd.toml if an admin made one). wadd never writes
# either: what changes at run time is state, under /var/lib/wadspaces.
# The rest are wad_config's defaults for a machine.

[machine]
name = "wadspaces"

[keys]
# wadd grabs the keyboards: Super+Tab switches, Super+1..9 jump, Super+0 or
# Super+Space bring back the launcher, and `block` never reaches a workspace.
home = ["KEY_0", "KEY_SPACE"]
block = ["alt+f4", "ctrl+shift+q", "ctrl+alt+backspace"]

[cloud]
# The account this machine links to (WadSpaces links it at first sign-in).
project_id = "wad-spaces"
functions_region = "australia-southeast2"

[streaming]
# Streams reach browsers at https://ws-<guid>.wadspaces.com through the
# Cloudflare tunnel (cloudflared.service) and wadd's proxy on :8085.
# WebSockets only; `webrtc = true` adds WebRTC (STUN and Cloudflare's TURN).
domain = "wadspaces.com"
webrtc = false

[tailnet]
# The owner's Tailscale network (tailscaled.service): the machine joins it
# from WadSpaces (Machines → this machine → Tailnet), and the devices the
# owner trusts reach wadd's remote API on its tailnet addresses, :8087,
# bound to tailscale0 (host/TAILNET.md).
port = 8087
bind_device = "tailscale0"
