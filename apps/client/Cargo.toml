[package]
name = "client"
description = "WadSpaces Client: the machine's shell, in GTK4 (/usr/bin/client)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
gdk-wayland = { package = "gdk4-wayland", version = "0.11" }
wad-gtk = { path = "../../crates/wad-gtk" }
wad-wadd-client = { path = "../../crates/wad-wadd-client" }
wad-account = { path = "../../crates/wad-account" }
wad-board.workspace = true
wad-proto.workspace = true
wad-core.workspace = true
wad-icons.workspace = true
wad-wallpaper = { path = "../../crates/wad-wallpaper" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-channel = "2"
qrcode.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
