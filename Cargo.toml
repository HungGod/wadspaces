[workspace]
resolver = "3"
members = ["crates/*", "apps/wadd", "apps/hud", "apps/wadbrowser", "apps/client", "apps/signin", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
wad-proto = { path = "crates/wad-proto" }
wad-github = { path = "crates/wad-github" }
wad-firebase = { path = "crates/wad-firebase" }
wad-core = { path = "crates/wad-core" }
wad-config = { path = "crates/wad-config" }
wad-store = { path = "crates/wad-store" }
wad-podman = { path = "crates/wad-podman" }
wad-systemd = { path = "crates/wad-systemd" }
wad-sway = { path = "crates/wad-sway" }
wad-input = { path = "crates/wad-input" }
wad-git = { path = "crates/wad-git" }
wad-net = { path = "crates/wad-net" }
wad-bt = { path = "crates/wad-bt" }
wad-icons = { path = "crates/wad-icons" }
wad-notes = { path = "crates/wad-notes" }
wad-wallpaper = { path = "crates/wad-wallpaper" }
wad-wadd-client = { path = "crates/wad-wadd-client" }
wad-gtk = { path = "crates/wad-gtk" }
wad-account = { path = "crates/wad-account" }
wad-board = { path = "crates/wad-board" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
getrandom = "0.3"
thiserror = "2"
toml = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "signal", "io-util", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# WadBrowser's chrome is a Tauri window.
tauri = "2.12"
tauri-build = "2.7"
# WadBrowser drives WebKitGTK itself, beside Tauri: these must be the versions
# wry uses, or the widgets Tauri hands back are of another type.
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

wiremock = "0.6"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log"] }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["user", "fs", "ioctl", "poll", "hostname"] }
evdev = "0.13"
libc = "0.2"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tempfile = "3"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
async-trait = "0.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# Dev builds and tests: line numbers for backtraces, none of the rest of the
# debug info (dependencies get none). Full debug info made each test binary
# ~450 MB, and linking a few at once ran a 7 GB laptop out of memory. For a
# debugger session, build with CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

# Icon work (wad-icons, in wadd and its tests) is pixel loops: optimised even
# in dev builds, or a card takes seconds.
[profile.dev.package.wad-icons]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3

# WadBrowser and wadspaces-icon as they go into the workspace base image:
# fast to start, small (images/build.sh).
[profile.wadbrowser]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The UI's WebAssembly (cargo xtask wasm): small over fast.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
